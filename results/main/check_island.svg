<title id="t">第 3 步檢查：同一套政策，四種架構，打擊後誰能重新分配</title><desc id="d">各情境與架構在打擊後，發生低頻卸載的調度時槽比例、變電所收到新決策的比例、用戶用電滿足率、輪停公平性和預簽輪停表的切換次數</desc>
<rect class="bg" width="710" height="728"/>
<text class="t1 title" x="16" y="26">第 3 步檢查：同一套政策，四種架構，打擊後誰能重新分配</text>
<text class="t2" x="16" y="46">12 條饋線、4 座變電所，24 小時、12 次；凌晨約 3 點打擊，供電掉到 45% 或 25%</text>
<text class="t2" x="16" y="64">打擊同時失去站點：A、B 的調度中心，C、D 的驗證者；B 失去兩個中心後跑預簽輪停表（假設還有 40% 的電）</text>
