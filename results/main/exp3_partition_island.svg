<title id="t">exp3 孤島上的分區：A、B 會腦裂，C、D 沒有 Q 就維持現狀</title><desc id="d">各種分區與干擾下，兩組變電所收到新決策的比例、打擊後低頻卸載、兩個中心同時下令的時槽數與用戶用電滿足率</desc>
<rect class="bg" width="889" height="708"/>
<text class="t1 title" x="16" y="26">exp3 孤島上的分區：A、B 會腦裂，C、D 沒有 Q 就維持現狀</text>
<text class="t2" x="16" y="46">12 條饋線、4 座變電所，24 小時、凌晨約 3 點打擊後剩 45% 供電；每列 20 次</text>
<text class="t2" x="16" y="64">分區從打擊開始兩小時（前兩欄只看這段）；干擾是全天每條連線 10% 的時間斷線（前兩欄看打擊後到結束）</text>
<text class="t2" x="16" y="82">腦裂：備援收不到中心的心跳就接手，兩個中心各自對連得到的變電所下令</text>
