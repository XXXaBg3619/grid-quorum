<title id="t">exp4 舊指令重放：變電所的哪一項檢查擋得住</title><desc id="d">各種變電所驗證規則面對三種重放攻擊時，重放指令被執行的比例，以及不攻擊時合法指令的執行率</desc>
<rect class="bg" width="832" height="480"/>
<text class="t1 title" x="16" y="26">exp4 舊指令重放：變電所的哪一項檢查擋得住</text>
<text class="t2" x="16" y="46">7 個驗證者、4 座變電所、每 5 分鐘輪停一組饋線；6 次、每次 6 小時，無訊息遺失</text>
<text class="t2" x="16" y="64">每一列都有 commit proof 簽章檢查；偏離是饋線狀態和「全部檢查、不攻擊」不同的時間（12 條饋線合計、每次平均）</text>
<text class="t1 ptitle" x="340.0" y="94" text-anchor="middle">重放的指令被執行的比例</text>
