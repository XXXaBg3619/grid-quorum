<title id="t">exp1 作惡節點在孤島上：f 以內也能讓舊狀態的決策過關，「報告必收」規則擋住</title><desc id="d">有無報告必收規則、不同作惡節點數下，分叉的比例、不含新報告的區塊被提交的比例、打擊後低頻卸載次數、收到新決策的時槽比例和關鍵饋線供電時間</desc>
