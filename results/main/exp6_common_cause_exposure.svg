<title id="t">exp6 攻破一個節點看得到什麼：C、D 的讀取面比 A、B 大</title><desc id="d">各架構每種節點收到幾座變電所的狀態和指令、有沒有全島量測、攻破一個是否就讀到全島</desc>
<rect class="bg" width="632" height="548"/>
<text class="t1 title" x="16" y="26">exp6 攻破一個節點看得到什麼：C、D 的讀取面比 A、B 大</text>
<text class="t2" x="16" y="46">2 小時、供電 45% 的誠實執行，記錄每個節點實際收到的狀態回報、指令和量測（4 座變電所）</text>
<text class="t2" x="16" y="64">收到每座變電所饋線狀態（全島哪裡有電）的節點：A 2 個、B 2 個、C 11 個、D 11 個</text>
<text class="t2" x="16" y="82">C、D 多出來的是 7 個驗證者和 4 座變電所：提交證明簽的是整個區塊，所以變電所收到整個區塊</text>
