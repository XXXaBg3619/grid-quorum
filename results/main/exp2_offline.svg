<title id="t">exp2 驗證者離線：f 個以內照常提交，超過就停下來，回來後接上</title><desc id="d">不同委員會大小與離線節點數下，離線期間有區塊提交的時槽比例、提交延遲，以及恢復後到第一次提交的時間</desc>
<rect class="bg" width="1142" height="498"/>
<text class="t1 title" x="16" y="26">exp2 驗證者離線：f 個以內照常提交，超過就停下來，回來後接上</text>
<text class="t2" x="16" y="46">36 個 5 分鐘時槽，第 6 到 18 個時槽（一小時）有 k 個驗證者完全不收不送；每格 20 次</text>
<text class="t2" x="16" y="64">離線的是最後 k 個，輪到它們當提案者時連續逾時（延遲最差的情況）；回來的驗證者從其他人補齊區塊</text>
<text class="t2" x="16" y="82">f 個離線時剩下的正好是 Q 個，任何一則訊息遺失都湊不滿：不重送時大多數時槽做不出決策，重送就恢復</text>
<text class="t1 ptitle" x="471.0" y="112" text-anchor="middle">時槽的比例</text>
<line class="axis" x1="265" x2="677" y1="117" y2="117"/>
<text class="t2" x="331.0" y="132" text-anchor="middle">離線期間有區塊的時槽</text>
<text class="t2" x="331.0" y="150" text-anchor="middle">無遺失</text>
<text class="t2" x="471.0" y="132" text-anchor="middle">離線期間有區塊的時槽</text>
<text class="t2" x="471.0" y="150" text-anchor="middle">遺失 10%，不重送</text>
<text class="t2" x="611.0" y="132" text-anchor="middle">離線期間有區塊的時槽</text>
<text class="t2" x="611.0" y="150" text-anchor="middle">遺失 10%，重送 2 次</text>
<text class="t2" x="697.0" y="132" text-anchor="start">離線期間提交延遲 p95</text>
<text class="t2" x="697.0" y="150" text-anchor="start">三種網路依序</text>
<text class="t2" x="915.0" y="132" text-anchor="start">恢復後到第一次提交</text>
<text class="t2" x="915.0" y="150" text-anchor="start">三種網路依序</text>
<text class="t1" x="16" y="179.0">n = 7（f = 2）｜0 個離線（無）</text>
