<title id="t">exp1 作惡節點雙簽：f 個以內不會分叉，f + 1 個就會</title><desc id="d">不同委員會大小與作惡節點數下，誠實節點提交兩個不同區塊的高度比例、沒有提交的高度比例、提交延遲和抓到的雙簽者</desc>
<rect class="bg" width="1196" height="438"/>
<text class="t1 title" x="16" y="26">exp1 作惡節點雙簽：f 個以內不會分叉，f + 1 個就會</text>
<text class="t2" x="16" y="46">作惡的提案者把兩個區塊各送給一半的誠實節點，作惡者在兩邊各投一票；每格 20 次、每次 50 個高度</text>
<text class="t2" x="16" y="64">格子是高度的比例；雙簽者以「一人次」計，被抓到 = 有誠實節點記下他同一輪的兩張簽名票</text>
<text class="t2" x="16" y="82">分叉時沒有誠實節點同時看到兩邊的票，但兩份提交證明至少共用 f + 1 個簽名，正好點名作惡者</text>
<text class="t1 ptitle" x="493.0" y="112" text-anchor="middle">高度的比例</text>
<line class="axis" x1="265" x2="721" y1="117" y2="117"/>
