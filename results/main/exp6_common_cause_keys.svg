<title id="t">exp6 攻破幾個節點能做什麼：A、B 一個就全拿，C、D 是 1、3、5</title><desc id="d">各架構被攻破不同節點數時，攻擊者能否讀取全島資料、癱瘓調度、偽造指令</desc>
<rect class="bg" width="737" height="452"/>
<text class="t1 title" x="16" y="26">exp6 攻破幾個節點能做什麼：A、B 一個就全拿，C、D 是 1、3、5</text>
<text class="t2" x="16" y="46">2 小時、供電 45% 的孤島，第 30 分鐘起攻擊；讀取：收到每座變電所的饋線狀態；癱瘓：之後沒有任何指令被執行</text>
<text class="t2" x="16" y="64">偽造：執行了誠實執行沒有的指令（全部復電）；C、D 是同一份程式，被攻破的驗證者停止投票（癱瘓）或自己簽提交證明（偽造）</text>
