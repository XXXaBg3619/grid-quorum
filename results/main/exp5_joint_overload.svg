<title id="t">exp5 每道單看都合規、合起來有害：在地檢查擋得住明顯違規，擋不住組合</title><desc id="d">三種攻擊下，各架構與不同被攻破節點數時，攻擊指令被執行的比例、低頻卸載、關鍵饋線與 S4 的供電時間</desc>
<rect class="bg" width="835" height="878"/>
<text class="t1 title" x="16" y="26">exp5 每道單看都合規、合起來有害：在地檢查擋得住明顯違規，擋不住組合</text>
<text class="t2" x="16" y="46">12 條饋線、4 座變電所，24 小時、凌晨約 3 點打擊後剩 45% 供電；打擊後 10 分鐘起攻擊到當天結束；每列 20 次</text>
<text class="t2" x="16" y="64">A、B：攻擊者控制調度中心（1 個節點，用中心自己的金鑰簽）</text>
<text class="t2" x="16" y="82">C、D：攻擊者握有幾個驗證者的金鑰，提案夾帶攻擊指令，並每個時槽自己簽一份提交證明直接送到變電所</text>
